<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Moonfall: Lost Signal</title><style>
*{box-sizing:border-box}body{margin:0;background:#09101e;color:#f4f7ff;font:14px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:12px}.game{width:min(100%,650px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.title{font-size:21px;font-weight:950;letter-spacing:-.04em}.title span{color:#82e9ff}.stat{color:#c4cee4;font-weight:750}.frame{position:relative;border:1px solid #7397db77;border-radius:17px;overflow:hidden;background:#101a31;box-shadow:0 15px 50px #0009}canvas{width:100%;height:auto;display:block;aspect-ratio:640/400;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080e1cdb;text-align:center;padding:20px}.overlay h2{font-size:30px;line-height:1.05;margin:0 0 7px}.overlay p{max-width:400px;color:#cad5eb;line-height:1.45}.btn{border:0;background:#91eeff;color:#071724;padding:11px 20px;border-radius:999px;font:900 15px system-ui;cursor:pointer}.controls{display:none;justify-content:center;gap:12px;margin-top:9px}.controls button{height:47px;min-width:64px;border:1px solid #a0caff88;border-radius:13px;background:#1d2d4e;color:white;font-size:20px;font-weight:900;touch-action:none}.help{text-align:center;color:#a7b5d2;font-size:11px;margin:8px 0 0}@media(max-width:680px){.controls{display:flex}}
</style></head><body><main class="game"><div class="top"><div class="title">MOONFALL: <span>LOST SIGNAL</span></div><div class="stat">✦ <b id="count">0 / 3</b> &nbsp; · &nbsp; ♥ <b id="hp">3</b></div></div><div class="frame"><canvas id="c" width="640" height="400" aria-label="Moonfall platform adventure"></canvas><div class="overlay" id="ov"><div><h2 id="hd">The beacon went dark.</h2><p id="msg">A tougher mission: collect all three crystals, dodge patrol drones, and reach the beacon. You have three lives.</p><button class="btn" id="go">START MISSION</button></div></div></div><div class="controls"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">▲</button></div><p class="help">Move: ← → / A D &nbsp; · &nbsp; Jump: ↑ / W / Space · touch controls on mobile</p></main><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),ov=document.querySelector('#ov'),hd=document.querySelector('#hd'),msg=document.querySelector('#msg'),go=document.querySelector('#go'),count=document.querySelector('#count');let keys={},held={},active=false,last=0,cam=0,score=0,lives=3,checkpoint={x:52,y:290},player,crystals,rocks,won=false;const W=640,H=400,world=1900,ground=340,plats=[{x:0,y:340,w:310},{x:370,y:310,w:200},{x:630,y:275,w:180},{x:870,y:320,w:210},{x:1160,y:280,w:200},{x:1430,y:315,w:220},{x:1695,y:340,w:205}];function reset(){player={x:52,y:290,vx:0,vy:0,w:24,h:36,on:false};crystals=[{x:445,y:275},{x:715,y:240},{x:1265,y:245}].map(a=>({...a,got:false,phase:Math.random()*6}));rocks=[{x:260,y:321,r:14,v:1.6,min:205,max:284},{x:965,y:302,r:17,v:-1.8,min:940,max:1050},{x:1560,y:297,r:14,v:2,min:1520,max:1610}];score=0;lives=3;checkpoint={x:52,y:290};cam=0;won=false;count.textContent='0 / 3';document.querySelector('#hp').textContent=lives}function start(){reset();active=true;ov.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111a39');g.addColorStop(1,'#283d5b');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(-cam,0);for(let i=0;i<95;i++){let sx=(i*173+39)%world,sy=(i*67+16)%215;x.globalAlpha=.4+(i%5)*.1;x.fillStyle='#e0f1ff';x.fillRect(sx,sy,2,2)}x.globalAlpha=1;x.fillStyle='#c1d4ef';x.beginPath();x.arc(535,83,31,0,7);x.fill();x.fillStyle='#9aaeca';for(let i=0;i<4;i++){x.beginPath();x.arc(523+i*13,72+(i%2)*19,4+i%2*2,0,7);x.fill()}for(let b of plats){x.fillStyle='#586d87';x.fillRect(b.x,b.y,b.w,400-b.y);x.fillStyle='#9eb6c6';x.fillRect(b.x,b.y,b.w,6);x.fillStyle='#37495f';for(let i=0;i<b.w;i+=26)x.fillRect(b.x+i,b.y+20,13,4)}for(let i=0;i<3;i++){let px=[1775,1794,1813][i];x.strokeStyle='#6eeaff';x.lineWidth=4;x.beginPath();x.moveTo(px,340);x.lineTo(px,267);x.stroke();x.fillStyle='#77efff';x.shadowBlur=20;x.shadowColor='#75eaff';x.beginPath();x.arc(px,260,8,0,7);x.fill();x.shadowBlur=0}for(let r of rocks){x.fillStyle='#dc7183';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();x.fillStyle='#ffb0a2';x.beginPath();x.arc(r.x-4,r.y-4,4,0,7);x.fill()}for(let a of crystals){if(a.got)continue;a.phase+=.07;x.save();x.translate(a.x,a.y+Math.sin(a.phase)*4);x.shadowBlur=16;x.shadowColor='#7cf4ff';x.fillStyle='#8af5ff';x.beginPath();x.moveTo(0,-14);x.lineTo(10,0);x.lineTo(0,14);x.lineTo(-10,0);x.closePath();x.fill();x.restore()}x.fillStyle='#ffbc73';x.fillRect(player.x,player.y+player.h-2,player.w,4);x.fillStyle='#81eaff';x.fillRect(player.x,player.y+8,player.w,player.h-8);x.fillStyle='#d7fcff';x.fillRect(player.x+5,player.y-2,14,14);x.fillStyle='#233854';x.fillRect(player.x+8,player.y+2,3,4);x.fillRect(player.x+15,player.y+2,3,4);x.restore();let bar=100*score/3;x.fillStyle='#ffffff22';x.fillRect(14,14,104,7);x.fillStyle='#8af5ff';x.fillRect(14,14,bar,7);x.fillStyle='#fff';x.font='12px system-ui';x.fillText('CHECKPOINT',14,39)}
function loop(t){if(!active)return;let dt=Math.min((t-last)/16.67,2);last=t;let left=keys.ArrowLeft||keys.a||held.left,right=keys.ArrowRight||keys.d||held.right,jump=keys.ArrowUp||keys.w||keys[' ']||held.jump;player.vx=left?-3.2:right?3.2:0;player.x=Math.max(0,Math.min(world-player.w,player.x+player.vx*dt));if(jump&&player.on){player.vy=-11.2;player.on=false}player.vy+=.55*dt;player.y+=player.vy*dt;player.on=false;for(let b of plats)if(player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h>=b.y&&player.y+player.h-player.vy*dt<=b.y&&player.vy>=0){player.y=b.y-player.h;player.vy=0;player.on=true}for(let a of crystals)if(!a.got&&Math.abs((player.x+12)-a.x)<25&&Math.abs((player.y+17)-a.y)<27){a.got=true;score++;count.textContent=score+' / 3'}for(let r of rocks){r.x+=r.v*dt;if(r.x<r.min||r.x>r.max)r.v*=-1}let hit=rocks.some(r=>Math.abs((player.x+12)-r.x)<r.r+11&&Math.abs((player.y+20)-r.y)<r.r+13);if(player.x>850&&checkpoint.x<850)checkpoint={x:884,y:284};if(player.x>1400&&checkpoint.x<1400)checkpoint={x:1445,y:279};if(player.y>460)hit=true;if(hit){lives--;document.querySelector('#hp').textContent=lives;if(lives<=0){active=false;hd.textContent='Mission failed';msg.textContent='Out of lives. Restart the mission and try a different route!';go.textContent='RESTART FROM START';ov.style.display='grid';draw();return}player.x=checkpoint.x;player.y=checkpoint.y;player.vy=0;player.on=false}cam=Math.max(0,Math.min(world-W,player.x-190));if(player.x>1710&&score===3){active=false;won=true;hd.textContent='Signal restored!';msg.textContent='You found every crystal, survived the drone patrols, and restored the beacon. Moonbase hero status earned!';go.textContent='PLAY AGAIN';ov.style.display='grid'}draw();if(active)requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('.controls button').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();held[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[k]=false)});go.addEventListener('click',start);reset();draw()})();
</script></body></html>
